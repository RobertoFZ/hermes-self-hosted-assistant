services:
  hermes:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        HERMES_BASE_IMAGE: "${HERMES_BASE_IMAGE:-nousresearch/hermes-agent:latest}"
        OPENSPEC_VERSION: "${OPENSPEC_VERSION:-1.6.0}"
    image: "${HERMES_LOCAL_IMAGE:-hermes-self-hosted-assistant:local}"
    restart: unless-stopped
    command: ["gateway", "run"]
    stdin_open: true
    tty: true
    ports:
      - "127.0.0.1:9119:9119"
    env_file:
      - .review.env
    environment:
      HERMES_UID: "${HERMES_UID:-10000}"
      HERMES_GID: "${HERMES_GID:-10000}"
      HERMES_DASHBOARD: "1"
      HERMES_DASHBOARD_HOST: "0.0.0.0"
      HERMES_DASHBOARD_PORT: "9119"
      HERMES_DASHBOARD_BASIC_AUTH_USERNAME: "${HERMES_DASHBOARD_BASIC_AUTH_USERNAME:?set it in .env}"
      HERMES_DASHBOARD_BASIC_AUTH_PASSWORD: "${HERMES_DASHBOARD_BASIC_AUTH_PASSWORD:?set it in .env}"
      HERMES_DASHBOARD_BASIC_AUTH_SECRET: "${HERMES_DASHBOARD_BASIC_AUTH_SECRET:?set it in .env}"
      GH_CONFIG_DIR: "/opt/data/.config/gh"
      GIT_CONFIG_GLOBAL: "/opt/data/.gitconfig"
      GITHUB_TOKEN: "${GITHUB_TOKEN:-}"
    volumes:
      - hermes-data:/opt/data
      - type: bind
        source: ./plugins/slack-pr-review-gate
        target: /opt/data/plugins/slack-pr-review-gate
        read_only: true
      - type: bind
        source: ./skills/pr-reviewer
        target: /opt/global-skills/pr-reviewer
        read_only: true

volumes:
  hermes-data:
    # Keep this default stable: it is the existing secret-bearing runtime
    # volume and is intentionally independent from the checkout directory.
    name: "${HERMES_DATA_VOLUME:-self-assistant-hermes-data}"
