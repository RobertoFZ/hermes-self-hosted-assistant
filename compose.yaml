x-hermes-runtime: &hermes-runtime
    build:
      context: .
      dockerfile: Dockerfile
      args:
        HERMES_BASE_IMAGE: "${HERMES_BASE_IMAGE:-nousresearch/hermes-agent:latest}"
        CODEX_VERSION: "${CODEX_VERSION:-0.149.1}"
        OPENSPEC_VERSION: "${OPENSPEC_VERSION:-1.6.0}"
        PASEO_VERSION: "${PASEO_VERSION:-0.5.2}"
    image: "${HERMES_LOCAL_IMAGE:-hermes-self-hosted-assistant:local}"

services:
  hermes:
    <<: *hermes-runtime
    restart: unless-stopped
    command: ["gateway", "run"]
    stdin_open: true
    tty: true
    ports:
      - "127.0.0.1:9119:9119"
    env_file:
      - .review.env
    environment:
      HERMES_UID: "${HERMES_UID:-10000}"
      HERMES_GID: "${HERMES_GID:-10000}"
      HERMES_DASHBOARD: "1"
      HERMES_DASHBOARD_HOST: "0.0.0.0"
      HERMES_DASHBOARD_PORT: "9119"
      HERMES_DASHBOARD_BASIC_AUTH_USERNAME: "${HERMES_DASHBOARD_BASIC_AUTH_USERNAME:?set it in .env}"
      HERMES_DASHBOARD_BASIC_AUTH_PASSWORD: "${HERMES_DASHBOARD_BASIC_AUTH_PASSWORD:?set it in .env}"
      HERMES_DASHBOARD_BASIC_AUTH_SECRET: "${HERMES_DASHBOARD_BASIC_AUTH_SECRET:?set it in .env}"
      GH_CONFIG_DIR: "/opt/data/.config/gh"
      GIT_CONFIG_GLOBAL: "/opt/data/.gitconfig"
      GITHUB_TOKEN: "${GITHUB_TOKEN:-}"
      PASEO_PASSWORD: "${PASEO_PASSWORD:?set it in .env}"
      PASEO_HOST: "paseo:6767"
      REVIEW_HISTORY_DB: "/opt/data/review-history/reviews.sqlite3"
      REVIEW_RESULT_SCHEMA: "/opt/review-automation/review-result.schema.json"
      REVIEW_CRON_CONFIG: "/opt/review-config/crons.json"
      REVIEW_CRON_STATE: "/opt/data/cron/repository-managed-jobs.json"
    volumes:
      - hermes-data:/opt/data
      - type: bind
        source: ./plugins/slack-pr-review-gate
        target: /opt/data/plugins/slack-pr-review-gate
        read_only: true
      - type: bind
        source: ./skills/codex-pr-review
        target: /opt/global-skills/codex-pr-review
        read_only: true
      - type: bind
        source: ./skills/review-digest
        target: /opt/global-skills/review-digest
        read_only: true
      - type: bind
        source: ./automation
        target: /opt/review-automation
        read_only: true
      - type: bind
        source: ./config
        target: /opt/review-config
        read_only: true
      - type: bind
        source: ./scripts
        target: /opt/review-tooling
        read_only: true
      - type: bind
        source: ./skills/pr-reviewer/scripts/prepare-workspace.sh
        target: /opt/review-workspace/prepare-workspace.sh
        read_only: true

  paseo-docker:
    image: "${PASEO_DOCKER_IMAGE:-docker:29.7.2-dind}"
    hostname: paseo-docker
    privileged: true
    restart: unless-stopped
    environment:
      DOCKER_TLS_CERTDIR: "/certs"
    volumes:
      - paseo-docker-data:/var/lib/docker
      - paseo-docker-certs:/certs/client
      # The nested daemon resolves worktree bind mounts from this exact path.
      - hermes-data:/opt/data
    networks:
      - paseo-docker
    healthcheck:
      test: ["CMD", "docker", "info"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  paseo:
    <<: *hermes-runtime
    restart: unless-stopped
    entrypoint: ["/usr/local/bin/paseo-entrypoint"]
    depends_on:
      hermes:
        condition: service_started
      paseo-docker:
        condition: service_healthy
    ports:
      - "127.0.0.1:${PASEO_HOST_PORT:-6767}:6767"
      - "127.0.0.1:${LINEAR_OAUTH_CALLBACK_HOST_PORT:-5555}:5555"
    env_file:
      - .review.env
    environment:
      HOME: "/opt/data"
      HERMES_UID: "${HERMES_UID:-10000}"
      HERMES_GID: "${HERMES_GID:-10000}"
      PASEO_HOME: "/opt/data/.paseo"
      PASEO_PASSWORD: "${PASEO_PASSWORD:?set it in .env}"
      # Allow the Compose service hostname used by Hermes while retaining
      # Paseo's default localhost and IP-address allowances.
      PASEO_HOSTNAMES: "paseo"
      PASEO_DOCKER_CERT_SOURCE: "/run/paseo-docker-certs"
      DOCKER_HOST: "tcp://paseo-docker:2376"
      DOCKER_TLS_VERIFY: "1"
      DOCKER_CERT_PATH: "/opt/data/.paseo/docker-certs"
      GH_CONFIG_DIR: "/opt/data/.config/gh"
      GIT_CONFIG_GLOBAL: "/opt/data/.gitconfig"
      GITHUB_TOKEN: "${GITHUB_TOKEN:-}"
    volumes:
      - hermes-data:/opt/data
      - paseo-docker-certs:/run/paseo-docker-certs:ro
      - type: bind
        source: ./skills/pr-reviewer
        target: /opt/data/.agents/skills/pr-reviewer
        read_only: true
    networks:
      - default
      - paseo-docker
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--show-error", "http://127.0.0.1:6767/api/health"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s

volumes:
  hermes-data:
    # Keep this default stable: it is the existing secret-bearing runtime
    # volume and is intentionally independent from the checkout directory.
    name: "${HERMES_DATA_VOLUME:-self-assistant-hermes-data}"
  paseo-docker-data:
    name: "${PASEO_DOCKER_DATA_VOLUME:-self-assistant-paseo-docker-data}"
  paseo-docker-certs:
    name: "${PASEO_DOCKER_CERTS_VOLUME:-self-assistant-paseo-docker-certs}"

networks:
  paseo-docker:
    name: "${PASEO_DOCKER_NETWORK:-self-assistant-paseo-docker}"
